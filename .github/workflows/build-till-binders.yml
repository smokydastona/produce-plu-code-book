name: Build till-binder review copies

on:
  workflow_dispatch:
    inputs:
      binder_path:
        description: Repository-relative path to the untouched original complete till binder
        type: string
        required: false
        default: sources/binders/Complete_Till_Binder_-_Nov_2025.xlsx

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y libreoffice-calc libreoffice-writer fonts-dejavu-core
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Require an existing original workbook inside this checkout
        env:
          BINDER_PATH: ${{ inputs.binder_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path.cwd().resolve()
          path = (root / os.environ["BINDER_PATH"]).resolve()
          if not path.is_relative_to(root) or not path.is_file() or path.suffix.lower() != ".xlsx":
              raise SystemExit("Missing original .xlsx inside repository. Upload the untouched binder first; no source is fabricated.")
          PY
      - name: Generate both complete review copies and verify printed Produce and Deli sheets
        env:
          BINDER_PATH: ${{ inputs.binder_path }}
        run: |
          python tools/build_till_binders.py --binder "$BINDER_PATH" \
            --output "$RUNNER_TEMP/till-binder-review" --verify-print --booklets
      - name: Upload review copies and reports without publishing a release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: till-binder-review-${{ github.sha }}
          path: ${{ runner.temp }}/till-binder-review/
          if-no-files-found: warn
          retention-days: 30
