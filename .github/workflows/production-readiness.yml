name: Audit production readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Inventory blockers without granting approval
        run: python tools/audit_production.py --output "$RUNNER_TEMP/production-readiness"
      - name: Upload readiness report even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness
          path: ${{ runner.temp }}/production-readiness/
          if-no-files-found: warn
