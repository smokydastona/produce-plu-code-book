name: Fetch unreviewed produce candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s tools -p 'test_candidate_manifest.py'
      - name: Download and inspect candidate dimensions
        run: |
          mkdir -p "$RUNNER_TEMP/produce-candidates"
          cp sources/temp_upload/candidates.json "$RUNNER_TEMP/produce-candidates/candidates.json"
          python tools/candidate_manifest.py sources/temp_upload/candidates.json \
            --markdown "$RUNNER_TEMP/produce-candidates/candidates_manifest.md" \
            --download-dir "$RUNNER_TEMP/produce-candidates/images"
      - name: Upload unreviewed candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unreviewed-produce-images
          path: ${{ runner.temp }}/produce-candidates/
          if-no-files-found: warn
          retention-days: 7
