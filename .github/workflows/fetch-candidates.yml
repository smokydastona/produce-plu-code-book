name: Fetch unreviewed produce candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Acquire all rejected entries and build review package
        run: |
          python tools/retrieve_commons.py --review data/image_review.csv \
            --leads sources/temp_upload/candidates.json \
            --output "$RUNNER_TEMP/produce-candidates" --per-entry 2 \
            --user-agent "ProducePLUReview/1.0 (https://github.com/smokydastona/produce-plu-code-book)"
      - name: Upload unreviewed candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unreviewed-produce-images
          path: ${{ runner.temp }}/produce-candidates/
          if-no-files-found: warn
          retention-days: 7
