name: Fetch unreviewed produce candidates

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Entries to acquire (working-list-rejected uses the current identity-pinned visual review)
        type: choice
        options: [rejected, working-list-rejected, all]
        default: rejected
      per_entry:
        description: Candidate limit per entry (1 to 5)
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '2'
      shard:
        description: Full-catalog shard to run (ignored for rejected scope)
        type: choice
        options: [all, '0', '1', '2', '3', '4', '5']
        default: all
      sequence:
        description: Optional single IMAGE_VISUAL_REVIEW sequence for working-list-rejected scope
        type: string
        required: false
        default: ''
      search_query:
        description: Optional Commons search terms; only with one sequence
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(inputs.scope == 'all' && (inputs.shard == 'all' && '[0,1,2,3,4,5]' || format('[{0}]', inputs.shard)) || '[0]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Derive full-catalog requests from the current PickList
        if: inputs.scope == 'all'
        run: python tools/sync_picklist.py --catalog-only --output "$RUNNER_TEMP/picklist-sync"
      - name: Probe alternative libraries and search the four acquisition gaps
        id: source-probes
        if: matrix.shard == 0 && inputs.scope != 'working-list-rejected'
        continue-on-error: true
        run: |
          python tools/probe_image_sources.py \
            --output "$RUNNER_TEMP/source-discovery" \
            --user-agent "ProducePLUReview/1.0 (https://github.com/smokydastona/produce-plu-code-book)"
      - name: Report incomplete source discovery
        if: steps.source-probes.outcome == 'failure'
        run: echo "::warning::Some library probes failed. See source-probes.csv in the source-discovery artifact."
      - name: Acquire entries and build review package
        env:
          SCOPE: ${{ inputs.scope }}
          SHARD: ${{ matrix.shard }}
          PER_ENTRY: ${{ inputs.per_entry }}
          SEQUENCE: ${{ inputs.sequence }}
          SEARCH_QUERY: ${{ inputs.search_query }}
        run: |
          EXTRA_ARGS=()
          if [ "$SCOPE" = "all" ]; then
            REVIEW="$RUNNER_TEMP/picklist-sync/ALL_IMAGE_REQUESTS.csv"
            EXTRA_ARGS+=(--all-entries --shard-count 6 --shard-index "$SHARD")
          elif [ "$SCOPE" = "working-list-rejected" ]; then
            REVIEW=current/review-booklets/IMAGE_VISUAL_REVIEW.csv
            REVIEW_ARGS=(--working-list-review "$REVIEW")
            if [ -n "$SEQUENCE" ]; then
              EXTRA_ARGS+=(--sequence "$SEQUENCE")
            fi
            if [ -n "$SEARCH_QUERY" ]; then
              EXTRA_ARGS+=(--search-query "$SEARCH_QUERY")
            fi
          else
            REVIEW=data/image_review.csv
            REVIEW_ARGS=(--review "$REVIEW")
            EXTRA_ARGS+=(--leads sources/temp_upload/candidates.json)
          fi
          if [ "$SCOPE" = "all" ]; then
            REVIEW_ARGS=(--review "$REVIEW")
          fi
          python tools/retrieve_commons.py \
            --output "$RUNNER_TEMP/produce-candidates" --per-entry "$PER_ENTRY" \
            "${REVIEW_ARGS[@]}" "${EXTRA_ARGS[@]}" \
            --user-agent "ProducePLUReview/1.0 (https://github.com/smokydastona/produce-plu-code-book)"
      - name: Upload unreviewed candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unreviewed-produce-images-${{ matrix.shard }}
          path: ${{ runner.temp }}/produce-candidates/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload source-discovery evidence
        if: always() && matrix.shard == 0 && inputs.scope != 'working-list-rejected'
        uses: actions/upload-artifact@v4
        with:
          name: source-discovery
          path: ${{ runner.temp }}/source-discovery/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload compact review metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-review-metadata-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/produce-candidates/provenance.json
            ${{ runner.temp }}/produce-candidates/license-register.csv
            ${{ runner.temp }}/produce-candidates/acquisition-report.csv
            ${{ runner.temp }}/produce-candidates/contact-sheet-*.jpg
            ${{ runner.temp }}/produce-candidates/REVIEW.txt
          if-no-files-found: warn
          retention-days: 7
